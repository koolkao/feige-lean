name = "feige"
defaultTargets = ["Feige"]

[leanOptions]
pp.unicode.fun = true
relaxedAutoImplicit = false

# Mathlib pinned to the v4.36.0 release commit; lean-toolchain must match.
[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4"
rev = "fc4f59e577feb1a4956671bc04ac18aaaf8cd842"

[[lean_lib]]
name = "Feige"
